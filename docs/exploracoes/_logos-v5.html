<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo v5 — P1 com fio do Maison</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#fff;color:#33182E;font:500 16px/1.5 Figtree,system-ui,sans-serif;padding:28px 20px 60px}
h1{font:700 28px/1.1 Figtree;margin-bottom:6px}
h2{font:700 20px Figtree;margin:34px 0 4px}
p.s{color:#6b5b66;margin-bottom:18px;max-width:72ch}
.grid{display:grid;gap:16px;max-width:1120px}
.g4{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.g1{grid-template-columns:1fr}
.card{border:1px solid #eee;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card h3{font:700 14px Figtree;padding:10px 16px;background:#faf6f8}
.card h3 span{font-weight:500;color:#6b5b66}
.two{display:grid;grid-template-columns:1fr 1fr;flex:1}
.p{padding:28px 14px;display:flex;align-items:center;justify-content:center;background:var(--fundo)}
.p svg{width:100%;overflow:visible}
.rosa{--primaria:#B83A73;--fundo:#FFF8F4;--tinta:#33182E}
.marinho{--primaria:#1B2A5C;--fundo:#F6F8FD;--tinta:#131A3A}
.gv{font-family:'Great Vibes',cursive;fill:var(--primaria)}
.tg{font:600 11px Figtree,sans-serif;letter-spacing:.3em;fill:var(--tinta);text-transform:uppercase}
.ln{fill:none;stroke:var(--primaria);stroke-linecap:round}
.fl{fill:var(--primaria)}
symbol{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.w{fill:#fff;stroke:none}
</style></head><body>
<h1>Logo P1 com o fio do Maison</h1>
<p class="s">Layout do P1 (medalhão, nome, fio, descrição alinhada ao nome), trocando o fio liso pelo fio com losango no meio.</p>
<div class="grid g1" id="main"></div>

<h2>Novas tentativas de bolo</h2>
<p class="s">Quatro jeitos diferentes de desenhar, para o medalhão. O primeiro (bolo de três andares) é o que está acima.</p>
<div class="grid g4" id="cakes"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<!-- atual: três andares -->
<symbol id="q1" viewBox="0 0 100 100">
  <rect x="31" y="58" width="38" height="12" rx="2"/><rect x="37" y="46" width="26" height="12" rx="2"/><rect x="43" y="36" width="14" height="10" rx="2"/>
  <path d="M31 62q4.750 5 9.500 0q4.750 5 9.500 0q4.750 5 9.500 0q4.750 5 9.500 0M37 50q3.250 4 6.500 0q3.250 4 6.500 0q3.250 4 6.500 0q3.250 4 6.500 0"/>
  <circle class="w" cx="50" cy="31" r="3.200"/><path d="M50 28c0-2.500 1.500-4 4-4.500"/>
  <path d="M26 70h48M50 70v4M42 76h16"/></symbol>

<!-- r1 · perspectiva, dois andares, elíptico -->
<symbol id="r1" viewBox="0 0 100 100"><g transform="translate(0 -4)">
  <path d="M28 60V70A22 6.500 0 0 0 72 70V60"/><ellipse cx="50" cy="60" rx="22" ry="6.500"/>
  <path d="M36 47V55A14 4 0 0 0 64 55V47"/><ellipse cx="50" cy="47" rx="14" ry="4"/>
  <path d="M28 65A22 6.500 0 0 0 72 65" opacity=".65"/>
  <circle class="w" cx="50" cy="38.500" r="3"/><path d="M50 35.500c0-2.500 1.500-4 4-4.500"/>
  <path d="M50 77v3M43 82h14"/></g></symbol>

<!-- r2 · perspectiva com pérolas na base -->
<symbol id="r2" viewBox="0 0 100 100"><g transform="translate(0 -4)">
  <path d="M28 60V70A22 6.500 0 0 0 72 70V60"/><ellipse cx="50" cy="60" rx="22" ry="6.500"/>
  <path d="M36 47V55A14 4 0 0 0 64 55V47"/><ellipse cx="50" cy="47" rx="14" ry="4"/>
  <g class="w"><circle cx="33" cy="73.200" r="1.200"/><circle cx="39" cy="75.200" r="1.200"/><circle cx="45" cy="76.200" r="1.200"/><circle cx="51" cy="76.400" r="1.200"/><circle cx="57" cy="76" r="1.200"/><circle cx="63" cy="74.800" r="1.200"/><circle cx="68.500" cy="72.400" r="1.200"/></g>
  <circle class="w" cx="50" cy="38.500" r="3"/><path d="M50 35.500c0-2.500 1.500-4 4-4.500"/>
  <path d="M33 58q0-3 3-3.500M67 58q0-3-3-3.500" opacity=".0"/></g></symbol>

<!-- r3 · dois andares com topper de coração e pérolas -->
<symbol id="r3" viewBox="0 0 100 100">
  <rect x="31" y="58" width="38" height="13" rx="2.500"/><rect x="38" y="46" width="24" height="12" rx="2.500"/>
  <g class="w"><circle cx="36" cy="64.500" r="1.100"/><circle cx="42" cy="64.500" r="1.100"/><circle cx="48" cy="64.500" r="1.100"/><circle cx="54" cy="64.500" r="1.100"/><circle cx="60" cy="64.500" r="1.100"/><circle cx="66" cy="64.500" r="1.100"/>
  <circle cx="43" cy="52" r="1.100"/><circle cx="50" cy="52" r="1.100"/><circle cx="57" cy="52" r="1.100"/></g>
  <path d="M50 46V36"/><path class="w" d="M50 36C44 31 41 26 45.500 24.500C48 23.800 49.800 25.500 50 27C50.200 25.500 52 23.800 54.500 24.500C59 26 56 31 50 36z"/>
  <path d="M26 71h48M50 71v4M42 77h16"/></symbol>

<!-- r4 · bolo sobre boleira com ramos de folhas -->
<symbol id="r4" viewBox="0 0 100 100"><g transform="translate(0 -2)">
  <rect x="37" y="48" width="26" height="18" rx="3"/>
  <path d="M37 54q3.250 4.500 6.500 0q3.250 4.500 6.500 0q3.250 4.500 6.500 0q3.250 4.500 6.500 0"/>
  <circle class="w" cx="45" cy="44" r="3"/><circle class="w" cx="52" cy="43" r="3"/><circle class="w" cx="58" cy="44.500" r="2.600"/>
  <path d="M30 70h40M50 70v4M43 76h14"/>
  <path d="M33 62C27 58 26 52 28 46"/><path class="w" d="M28 46c-3-1-5-4-4-6c3 0 5 2 4 6zM29 51c-3-.5-6-3-5.500-5.500c3.200 .2 5.500 2.200 5.500 5.500zM31 57c-3-.2-6-2-6-4.500c3.200-.2 5.800 1.500 6 4.500z"/>
  <path d="M67 62C73 58 74 52 72 46"/><path class="w" d="M72 46c3-1 5-4 4-6c-3 0-5 2-4 6zM71 51c3-.5 6-3 5.500-5.500c-3.200 .2-5.500 2.200-5.500 5.500zM69 57c3-.2 6-2 6-4.500c-3.200-.2-5.800 1.500-6 4.500z"/></g></symbol>
</defs></svg>

<script>
const medal=(cx,cy,sym)=>`<circle class="ln" stroke-width="1" cx="${cx}" cy="${cy}" r="60"/><circle class="fl" cx="${cx}" cy="${cy}" r="52"/><use href="#${sym}" x="${cx-60}" y="${cy-60}" width="120" height="120"/>`;
const wm=(x,y,size)=>`<text class="gv" x="${x}" y="${y}" font-size="${size}">Evy's Cake</text>`;
const tag=(x,y)=>`<text class="tg" x="${x}" y="${y}">confeitaria artesanal</text>`;
// fio do Maison: dois traços e um losango no centro, vão de 10 de cada lado
const fio=(x1,x2,y)=>{const c=(x1+x2)/2;return `<path class="ln" stroke-width="1" d="M${x1} ${y}H${c-10}M${c+10} ${y}H${x2}"/><path class="fl" d="M${c} ${y-4}L${c+4} ${y}L${c} ${y+4}L${c-4} ${y}z"/>`};
const p1=sym=>`<svg viewBox="0 0 420 150">${medal(66,75,sym)}${wm(146,76,60)}${fio(150,372,106)}${tag(150,130)}</svg>`;
document.getElementById('main').innerHTML=`<div class="card"><h3>P1 + fio do Maison <span>· bolo de três andares, por enquanto</span></h3><div class="two"><div class="p rosa">${p1('q1')}</div><div class="p marinho">${p1('q1')}</div></div></div>`;
const cakes=[['r1','R1 · Em perspectiva','dois andares, vista levemente de cima'],['r2','R2 · Perspectiva com pérolas','mesma, com pérolas na base'],['r3','R3 · Topper de coração','pérolas e topper, como o que ela vende'],['r4','R4 · Boleira com ramos','bolo com frutinhas e ramos de folhas']];
document.getElementById('cakes').innerHTML=cakes.map(([id,t,d])=>{const m=`<svg viewBox="0 0 140 140" style="max-width:150px">${medal(70,70,id)}</svg>`;return `<div class="card"><h3>${t} <span>· ${d}</span></h3><div class="two"><div class="p rosa">${m}</div><div class="p marinho">${m}</div></div></div>`}).join('');
</script></body></html>
